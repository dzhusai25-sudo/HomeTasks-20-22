name: Sanity Check

on: [push, pull_request]

jobs:
  sanity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x" # Or your desired Node.js version
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
